<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background -->
  <rect width="512" height="512" fill="#B8F55A" rx="64"/>

  <!-- Outer border rectangle -->
  <rect x="40" y="136" width="432" height="240" rx="10" fill="#000000"/>

  <!-- Left half — black panel -->
  <rect x="50" y="146" width="202" height="220" fill="#000000"/>

  <!-- Right half — lime green panel -->
  <rect x="252" y="146" width="210" height="220" fill="#B8F55A"/>

  <!-- "PARK" text — lime green on black -->
  <text x="151" y="282" 
    font-family="Arial Black, Arial, sans-serif" 
    font-weight="900" 
    font-size="72" 
    fill="#B8F55A" 
    text-anchor="middle"
    letter-spacing="-2">PARK</text>

  <!-- "VIEW" text — dark blue on lime -->
  <text x="357" y="282" 
    font-family="Arial Black, Arial, sans-serif" 
    font-weight="900" 
    font-size="72" 
    fill="#2D0DB5" 
    text-anchor="middle"
    letter-spacing="-2">VIEW</text>
</svg>