// ═══════════════ ROLL CALL ═══════════════
function rRollCall(){
  const isStaff=cRole==='admin'||cRole==='moderator';
  const active=RC.find(s=>!s.closed)||null;
  const past=RC.filter(s=>s.closed).slice(0,10);
  const now=new Date();const h=now.getHours();
  const inWindow=h>=21&&h<23;
  const todayDone=RC.find(s=>s.closed&&isSameDay(s.t,Date.now()));

  // Only security sees the live roll call interface
  if(active&&cRole==='security'){
    return rRollCallLive(active);
  }

  return `<div class="shd"><div class="stl">Roll Call</div>${todayDone?`<span class="badge bk">Done today</span>`:''}</div>
  ${cRole==='security'&&!active?`
    <div class="card" style="text-align:center;padding:24px 16px">
      <i class="ti ti-clipboard-list" style="font-size:48px;color:var(--blue3);display:block;margin-bottom:12px"></i>
      <div style="font-size:17px;font-weight:800;margin-bottom:6px">Parking Roll Call</div>
      <div style="font-size:13px;color:var(--txt3);margin-bottom:6px;line-height:1.7">Walk the parking area flat-by-flat.<br>Toggle each vehicle Parked / Not Parked.<br>Unknown vehicles can be logged directly.</div>
      ${!inWindow?`<div class="alt aam" style="margin:12px 0;text-align:left"><i class="ti ti-clock" style="flex-shrink:0"></i><div style="font-size:12px"><strong>Outside the 9 PM – 11 PM window.</strong><br>Roll call flagged as out-of-window.</div></div>`:''}
      ${todayDone?`<div class="alt agn" style="margin:12px 0;text-align:left"><i class="ti ti-circle-check" style="flex-shrink:0"></i><div style="font-size:12px">Roll call already done today at ${fdt(todayDone.closedAt||todayDone.t).split(' ')[1]}</div></div>`:''}
      <button class="btn bacc" style="width:100%;margin-top:8px" onclick="startRollCall()"><i class="ti ti-player-play"></i> Start Roll Call</button>
    </div>`:''}

  ${isStaff?`<div class="alt abl" style="margin-bottom:12px"><i class="ti ti-info-circle" style="flex-shrink:0"></i><div style="font-size:12px">Roll call is done by security. Past and in-progress sessions appear below. Data syncs when the same device is used or when Google Sheets backend is connected.</div></div>`:''}
  ${isStaff&&active?`<div class="card" style="border-color:var(--ambb);background:var(--ambll)">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px"><i class="ti ti-clock" style="font-size:22px;color:var(--amb)"></i><div><div style="font-size:14px;font-weight:800;color:var(--amb)">Roll call in progress</div><div style="font-size:12px;color:var(--txt4)">Started ${ago(active.t)} by ${active.guardName} · ${active.entries.length} vehicles listed</div></div></div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
      <div style="text-align:center;background:var(--grnll);border:1px solid #86EFAC;border-radius:var(--r);padding:8px"><div style="font-size:18px;font-weight:800;color:var(--grn);font-family:var(--mono)">${active.entries.filter(e=>e.parked===true).length}</div><div style="font-size:10px;color:var(--grn);font-weight:700">Parked</div></div>
      <div style="text-align:center;background:var(--redll);border:1px solid var(--redb);border-radius:var(--r);padding:8px"><div style="font-size:18px;font-weight:800;color:var(--red);font-family:var(--mono)">${active.entries.filter(e=>e.parked===false).length}</div><div style="font-size:10px;color:var(--red);font-weight:700">Not in slot</div></div>
      <div style="text-align:center;background:var(--purll);border:1px solid var(--purb);border-radius:var(--r);padding:8px"><div style="font-size:18px;font-weight:800;color:var(--pur);font-family:var(--mono)">${(active.unknowns||[]).length}</div><div style="font-size:10px;color:var(--pur);font-weight:700">Unknown</div></div>
    </div>
  </div>`:''}

  <!-- Summary view for admin/mod/security -->
  ${past.length?`
    <div class="stl" style="margin-bottom:10px">${past.length} past session${past.length!==1?'s':''}</div>
    ${past.map(s=>rcSessionCard(s)).join('')}
  `:`<div class="empty"><i class="ti ti-clipboard"></i><p>No roll call sessions yet</p></div>`}`;
}

function rcSessionCard(s){
  const ok=s.entries.filter(e=>e.status==='registered').length;
  const vis=s.entries.filter(e=>e.status==='visitor').length;
  const unk=s.entries.filter(e=>e.status==='unknown').length;
  const dur=s.closedAt?Math.round((s.closedAt-s.t)/60000):0;
  const oow=s.outOfWindow?'⚠ Outside 9–11 PM window':'';
  return `<div class="card" style="cursor:pointer;margin-bottom:10px" onclick="viewRCSession('${s.id}')">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
      <div style="flex:1"><div style="font-size:13px;font-weight:700">${fdt(s.t)}</div><div style="font-size:11px;color:var(--txt4)">${dur} min · By: ${s.guardName}${oow?` · <span style="color:var(--amb)">${oow}</span>`:''}</div></div>
      <i class="ti ti-chevron-right" style="color:var(--txt5)"></i>
    </div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
      <div style="text-align:center;background:var(--grnll);border:1px solid #86EFAC;border-radius:var(--r);padding:8px 4px"><div style="font-size:20px;font-weight:800;color:var(--grn);font-family:var(--mono)">${ok}</div><div style="font-size:10px;color:var(--grn);font-weight:700;text-transform:uppercase">Registered</div></div>
      <div style="text-align:center;background:var(--ambll);border:1px solid var(--ambb);border-radius:var(--r);padding:8px 4px"><div style="font-size:20px;font-weight:800;color:var(--amb);font-family:var(--mono)">${vis}</div><div style="font-size:10px;color:var(--amb);font-weight:700;text-transform:uppercase">Visitor</div></div>
      <div style="text-align:center;background:var(--redll);border:1px solid var(--redb);border-radius:var(--r);padding:8px 4px"><div style="font-size:20px;font-weight:800;color:var(--red);font-family:var(--mono)">${unk}</div><div style="font-size:10px;color:var(--red);font-weight:700;text-transform:uppercase">Unknown</div></div>
    </div>
    ${unk>0?`<div style="margin-top:8px;font-size:12px;color:var(--red);font-weight:600"><i class="ti ti-alert-triangle"></i> ${unk} unknown vehicle${unk!==1?'s':''} found</div>`:''}
  </div>`;
}

function startRollCall(){
  RC.forEach(s=>{if(!s.closed){s.closed=true;s.closedAt=Date.now()}});
  const now=new Date();const h=now.getHours();
  const outOfWindow=!(h>=21&&h<23);
  // Build flat-wise vehicle list
  const entries=[];
  const regVehicles=P.filter(p=>p.isActive&&!p.isVacant&&p.type!=='security').flatMap(p=>p.vehicles.filter(v=>v.status==='active').map(v=>({plate:v.plate&&v.plate!=='NA'?v.plate:`${VLBL[v.type]||v.type} (no plate)`,flatNo:p.flatNo,resName:p.name,type:v.type,status:'registered',parked:null,t:Date.now()})));
  const visVehicles=VS.filter(x=>x.status==='active'&&!xp(x.exp)).map(v=>({plate:v.plate,flatNo:v.flatNo,resName:'Visitor',type:v.vtype||'car',status:'visitor',parked:null,t:Date.now()}));
  entries.push(...regVehicles,...visVehicles);
  const session={id:uid(),t:Date.now(),guardName:cP?.name||'Security',entries,unknowns:[],closed:false,closedAt:null,outOfWindow};
  RC.unshift(session);if(RC.length>20)RC=RC.slice(0,20);
  save();render();
}

function rRollCallLive(session){
  const reg=session.entries.filter(e=>e.status==='registered');
  const vis=session.entries.filter(e=>e.status==='visitor');
  const unk=session.unknowns||[];
  const parked=session.entries.filter(e=>e.parked===true).length;
  const notParked=session.entries.filter(e=>e.parked===false).length;
  const unset=session.entries.filter(e=>e.parked===null).length;
  const now=new Date();const h=now.getHours();
  const oow=session.outOfWindow;
  // Group by flat
  const flats=[...new Set(session.entries.map(e=>e.flatNo))].sort();
  return `<div class="shd">
    <div class="stl" style="color:var(--blue2)">🚗 Roll Call in Progress</div>
    <button class="btn bsm bgrn" onclick="endRollCall('${session.id}')"><i class="ti ti-flag-check"></i> End</button>
  </div>
  ${oow?`<div class="alt aam" style="margin-bottom:12px"><i class="ti ti-clock" style="flex-shrink:0"></i><div style="font-size:12px"><strong>Outside the 9–11 PM window.</strong> This roll call will be flagged.</div></div>`:''}
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px">
    <div class="sbox gn" style="padding:10px 6px"><div class="sval" style="color:var(--grn2);font-size:20px">${parked}</div><div class="slbl" style="color:var(--grn);font-size:9px">Parked</div></div>
    <div class="sbox rd" style="padding:10px 6px"><div class="sval" style="color:var(--red);font-size:20px">${notParked}</div><div class="slbl" style="color:var(--red);font-size:9px">Not in slot</div></div>
    <div class="sbox am" style="padding:10px 6px"><div class="sval" style="color:var(--amb);font-size:20px">${unset}</div><div class="slbl" style="color:var(--amb);font-size:9px">Pending</div></div>
    <div class="sbox pu" style="padding:10px 6px"><div class="sval" style="color:var(--pur);font-size:20px">${unk.length}</div><div class="slbl" style="color:var(--pur);font-size:9px">Unknown</div></div>
  </div>
  <!-- Unknown vehicle logger -->
  <div class="card" style="background:var(--redll);border-color:var(--redb)">
    <div style="font-size:13px;font-weight:700;color:var(--red);margin-bottom:8px"><i class="ti ti-alert-triangle"></i> Found an unknown vehicle?</div>
    <div style="display:flex;gap:8px">
      <input class="fi" id="rcUnkIn" placeholder="Plate number" style="flex:1;text-transform:uppercase;font-family:var(--mono)" oninput="this.value=this.value.toUpperCase()">
      <button class="cbtn" onclick="openCamFor('rcUnkIn',null)"><i class="ti ti-camera"></i></button>
    </div>
    <div style="display:flex;gap:8px;margin-top:8px">
      <input class="fi" id="rcUnkLoc" placeholder="Location / description" style="flex:1">
      <button class="btn brd" onclick="rcAddUnknown('${session.id}')"><i class="ti ti-plus"></i> Log</button>
    </div>
    ${unk.length?`<div style="margin-top:10px">${unk.map(u=>`<div class="rc-unk" style="margin-bottom:4px"><i class="ti ti-alert-triangle" style="font-size:16px;color:var(--red);flex-shrink:0"></i><div style="flex:1"><div style="font-family:var(--mono);font-size:13px;font-weight:700;color:var(--red)">${u.plate}</div>${u.loc?`<div style="font-size:11px;color:var(--txt4)">${u.loc}</div>`:''}</div></div>`).join('')}</div>`:''}
  </div>
  <!-- Flat-wise vehicle list -->
  ${flats.map(flat=>{
    const fEntries=session.entries.filter(e=>e.flatNo===flat);
    const fp=P.find(x=>x.flatNo===flat);
    return `<div class="card" style="margin-bottom:10px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
        <div class="ftag ${flat==='SEC'?'sec':'occ'}">${flat}</div>
        <div style="font-size:13px;font-weight:600;color:var(--txt)">${fp?.name||''}</div>
        <span id="flat-${session.id}-${flat}" style="font-size:11px;color:var(--txt4);margin-left:auto">${fEntries.filter(e=>e.parked===true).length}/${fEntries.length} parked</span>
      </div>
      ${fEntries.map(e=>`<div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1.5px solid var(--bdr)">
        <div style="flex:1">
          <div style="font-family:var(--mono);font-size:13px;font-weight:700;color:${e.status==='visitor'?'var(--amb)':'var(--txt)'}">${e.plate}</div>
          <div style="font-size:11px;color:var(--txt4)">${VLBL[e.type]||e.type}${e.status==='visitor'?' · Visitor':''}</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <span style="font-size:12px;font-weight:600;color:${e.parked===null?'#94A3B8':e.parked?'#15803D':'#DC2626'}">${e.parked===null?'—':e.parked?'Parked':'Not here'}</span>
          <div class="tgl${e.parked===true?' on':''}" data-plate="${e.plate}" onclick="rcToggleParked('${session.id}','${e.plate}')"></div>
        </div>
      </div>`).join('')}
    </div>`;
  }).join('')}
  <button class="btn bfull bgrn" style="margin-top:4px" onclick="endRollCall('${session.id}')"><i class="ti ti-flag-check"></i> End Roll Call & Save Summary</button>`;
}

function rcToggleParked(sid,plate){
  const s=RC.find(x=>x.id===sid);if(!s)return;
  const e=s.entries.find(x=>x.plate===plate);if(!e)return;
  e.parked=e.parked!==true;
  save();
  // Update counters and toggle without full re-render
  const parked=s.entries.filter(x=>x.parked===true).length;
  const notParked=s.entries.filter(x=>x.parked===false).length;
  const unset=s.entries.filter(x=>x.parked===null).length;
  // Update stat boxes
  const boxes=document.querySelectorAll('.sbox .sval');
  if(boxes[0])boxes[0].textContent=parked;
  if(boxes[1])boxes[1].textContent=notParked;
  if(boxes[2])boxes[2].textContent=unset;
  // Update the specific toggle element
  const tgl=document.querySelector('[data-plate="'+CSS.escape(plate)+'"]');
  if(tgl){
    tgl.classList.toggle('on',e.parked===true);
    const statusEl=tgl.previousElementSibling;
    if(statusEl){
      statusEl.textContent=e.parked===null?'—':e.parked?'Parked':'Not here';
      statusEl.style.color=e.parked===null?'#94A3B8':e.parked?'#15803D':'#DC2626';
    }
  }
  // Update flat parked count
  const flatKey='flat-'+sid+'-'+s.entries.find(x=>x.plate===plate)?.flatNo;
  const flatEl=document.getElementById(flatKey);
  if(flatEl){
    const flatEntries=s.entries.filter(x=>x.flatNo===s.entries.find(y=>y.plate===plate)?.flatNo);
    flatEl.textContent=flatEntries.filter(x=>x.parked===true).length+'/'+flatEntries.length+' parked';
  }
}

function rcAddUnknown(sid){
  const s=RC.find(x=>x.id===sid);if(!s)return;
  const plate=(document.getElementById('rcUnkIn')?.value||'').trim().toUpperCase();
  const loc=(document.getElementById('rcUnkLoc')?.value||'').trim();
  if(!plate){alert('Enter plate number');return}
  if(!s.unknowns)s.unknowns=[];
  if(s.unknowns.find(u=>u.plate===plate)){toast('Already logged','am');return}
  s.unknowns.push({plate,loc,t:Date.now()});
  // Also add to UK log
  UK.push({id:uid(),plate,location:loc||'Roll call',note:'Found during roll call',assignedTo:'',reportedBy:cP?.name||'Security',t:Date.now(),status:'open'});
  audit('rc_unk',`${plate} during roll call`);save();render();toast('Unknown logged','am');
}

function endRollCall(sid){
  const s=RC.find(x=>x.id===sid);if(!s)return;
  const ok=s.entries.filter(e=>e.status==='registered').length;
  const vis=s.entries.filter(e=>e.status==='visitor').length;
  const unk=(s.unknowns||[]).length;
  const parked=s.entries.filter(e=>e.parked===true).length;
  const notParked=s.entries.filter(e=>e.parked===false).length;
  const dur=Math.round((Date.now()-s.t)/60000);
  s.closed=true;s.closedAt=Date.now();
  s.summary={registered:ok,visitor:vis,unknown:unk,parked,notParked,total:s.entries.length,duration:dur};
  // Notify admin + moderator
  pushN(`✅ Roll call done — ${ok} registered (${parked} parked, ${notParked} not in slot), ${vis} visitors, ${unk} unknown${s.outOfWindow?' ⚠ (out of window)':''}`,['admin','moderator'],'rollcall');
  if(unk>0)pushN(`⚠ ${unk} unknown vehicle${unk!==1?'s':''} found in roll call`,['admin','moderator'],'unknown');
  audit('roll_call_end',`${s.entries.length} vehicles: ${parked} parked, ${notParked} not in slot, ${unk} unknown`);
  save();
  showSheet(`<div class="hdl"></div><div class="mtit"><i class="ti ti-flag-check" style="color:var(--grn2)"></i> Roll Call Complete!</div>
    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px">
      <div class="sbox gn" style="padding:14px 8px"><i class="ti ti-car sico" style="color:var(--grn2);font-size:18px"></i><div class="sval" style="color:var(--grn2)">${parked}</div><div class="slbl" style="color:var(--grn)">Parked</div></div>
      <div class="sbox rd" style="padding:14px 8px"><i class="ti ti-alert-circle sico" style="color:var(--red);font-size:18px"></i><div class="sval" style="color:var(--red)">${notParked}</div><div class="slbl" style="color:var(--red)">Not in slot</div></div>
      <div class="sbox am" style="padding:14px 8px"><i class="ti ti-ticket sico" style="color:var(--amb);font-size:18px"></i><div class="sval" style="color:var(--amb)">${vis}</div><div class="slbl" style="color:var(--amb)">Visitor</div></div>
      <div class="sbox pu" style="padding:14px 8px"><i class="ti ti-alert-triangle sico" style="color:var(--pur);font-size:18px"></i><div class="sval" style="color:var(--pur)">${unk}</div><div class="slbl" style="color:var(--pur)">Unknown</div></div>
    </div>
    <div style="background:var(--c2);border:1.5px solid var(--bdr);border-radius:var(--r2);padding:14px;margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px"><span style="color:var(--txt3)">Duration</span><strong>${dur} min</strong></div>
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px"><span style="color:var(--txt3)">By</span><strong>${s.guardName}</strong></div>
      ${s.outOfWindow?`<div style="font-size:12px;color:var(--amb);margin-top:4px;font-weight:600">⚠ Done outside 9–11 PM window</div>`:''}
    </div>

  visible.filter(b=>b.status==='published').forEach(b=>{if(!(b.readBy||[]).includes(myId)){if(!b.readBy)b.readBy=[];b.readBy.push(myId)}});

  ${isSec&&myRej.length?`<div class="alt ard" style="margin-bottom:12px"><i class="ti ti-x" style="flex-shrink:0"></i><div>${myRej.length} message${myRej.length!==1?'s':''} rejected</div></div>`:''}

          ${b.pinned?`<span class="badge bm" style="font-size:10px">📌</span>`:''}
          ${isNew?`<span style="width:7px;height:7px;border-radius:50%;background:var(--blue2);display:inline-block;flex-shrink:0"></span>`:''}
          <span style="font-size:14px;font-weight:800;color:var(--txt)">${b.title}</span>
        </div>
        <div style="font-size:11px;color:var(--txt4)">${b.sentByName}${b.editedAt?` · <em>edited ${ago(b.editedAt)}</em>`:''} · ${ago(b.t)}</div>

    </div>
    <div style="font-size:13px;color:var(--txt2);line-height:1.75;white-space:pre-wrap;margin-bottom:${isStaff?'10':'0'}px">${b.body}</div>
    ${isStaff?`<div style="display:flex;gap:6px;flex-wrap:wrap">
      ${editable?`<button class="btn bsm bam" onclick="editBC('${b.id}')"><i class="ti ti-pencil"></i> Edit <span style="font-size:10px;opacity:.7">(${Math.floor(sl/60)}:${String(sl%60).padStart(2,'0')})</span></button>`:''}
      <button class="btn bsm brd" onclick="confDelBC('${b.id}')"><i class="ti ti-trash"></i> Delete</button>
      <button class="btn bsm" onclick="togPin('${b.id}')">${b.pinned?'<i class="ti ti-pinned-off"></i> Unpin':'<i class="ti ti-pin"></i> Pin'}</button>

  </div>`;

function subBC(){
  const isSec=cRole==='security';
  const title=(document.getElementById('bc_ti')?.value||'').trim();const body=(document.getElementById('bc_bo')?.value||'').trim();
  if(!title||!body){alert('Title and message required');return}
  let targets=['residents'],priority='normal',pin=false;
  if(!isSec){
    const ir=document.getElementById('bc_res')?.checked;const is=document.getElementById('bc_sec')?.checked;
    if(!ir&&!is){alert('Select at least one recipient');return}
    targets=[];if(ir)targets.push('residents');if(is)targets.push('security');
    priority=document.querySelector('input[name="bc_pr"]:checked')?.value||'normal';
    pin=document.getElementById('bc_pin')?.checked||false;
  }
  const status=isSec?'pending':'published';
  const bc={id:uid(),title,body,targets,priority,pinned:pin,sentBy:cP?.id||cRole,sentByName:cP?.name||cRole,sentByRole:cRole,t:Date.now(),readBy:[cP?.id||cRole],status};
  BR.unshift(bc);
  if(status==='published'){const nr=[];if(targets.includes('residents'))nr.push('resident');if(targets.includes('security'))nr.push('security');nr.push('admin','moderator');pushN(`📢 ${priority==='urgent'?'🚨 ':''}${title}`,nr,'broadcast');toast('Published','ok')}
  else{pushN(`⏳ Security posted pending: "${title}"`,['admin','moderator'],'broadcast');toast('Submitted for approval','ok')}
  audit('bc',`"${title}"`);save();closeM();renderNav();render();
}
function approveBC(id){const b=BR.find(x=>x.id===id);if(!b)return;b.status='published';b.approvedBy=cP?.name||cRole;b.approvedAt=Date.now();const nr=[];if(b.targets.includes('residents'))nr.push('resident');if(b.targets.includes('security'))nr.push('security');nr.push('admin','moderator');pushN(`📢 ${b.title}`,nr,'broadcast');audit('bc_approve',`"${b.title}"`);save();render();toast('Published','ok')}
function rejectBC(id){showSheet(`<div class="hdl"></div><div class="mtit"><i class="ti ti-x" style="color:var(--red)"></i> Reject Message</div><div class="fg"><label class="fl">Reason</label><input class="fi" id="rj_bc" placeholder="Not relevant…"></div><button class="btn bfull brd" onclick="doRejectBC('${id}')">Reject</button><button class="btn bfull" onclick="closeM()">Cancel</button>`)}

function editBC(id){const b=BR.find(x=>x.id===id);if(!b)return;if(Date.now()-b.t>=5*60*1000){toast('Edit window expired','am');render();return}const sl=Math.ceil((5*60*1000-(Date.now()-b.t))/1000);showSheet(`<div class="hdl"></div><div class="mtit"><i class="ti ti-pencil" style="color:var(--amb)"></i> Edit Message</div><div class="alt aam" style="margin-bottom:12px"><i class="ti ti-clock" style="flex-shrink:0"></i><div><strong>${Math.floor(sl/60)}:${String(sl%60).padStart(2,'0')}</strong> left to edit</div></div><div class="fg"><label class="fl">Title</label><input class="fi" id="eb_ti" value="${b.title.replace(/"/g,'&quot;')}"></div><div class="fg"><label class="fl">Message</label><textarea class="fi" id="eb_bo" style="min-height:100px">${b.body}</textarea></div><button class="btn bfull bacc" onclick="subEditBC('${id}')">Save</button><button class="btn bfull" onclick="closeM()">Cancel</button>`)}

function confDelBC(id){const b=BR.find(x=>x.id===id);if(!b)return;showSheet(`<div class="hdl"></div><div class="mtit"><i class="ti ti-trash" style="color:var(--red)"></i> Delete Message</div><div class="cbox"><div class="ctit">${b.title}</div><div class="cdsc">Removes from all users' feeds permanently.</div></div><button class="btn bfull brd" onclick="doDelBC('${id}');closeM()">Yes, delete</button><button class="btn bfull" onclick="closeM()">Cancel</button>`)}

  showSheet(`<div class="hdl"></div><div class="mtit"><i class="ti ti-brand-whatsapp" style="color:var(--grn2)"></i> WhatsApp Alert</div>
    <div class="wabox" style="margin-bottom:14px"><div class="wabub" id="waPrev">${msg}</div><div class="watick">${dt} ✓✓</div></div>

function cpWA(){const t=document.getElementById('waEd')?.value||'';const s=()=>{const e=document.getElementById('cpOk');if(e){e.style.display='block';setTimeout(()=>{e.style.display='none'},2500)}};if(navigator.clipboard)navigator.clipboard.writeText(t).then(s).catch(()=>{fbCp(t);s()});else{fbCp(t);s()}}
function fbCp(t){const a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;opacity:0;top:0;left:0';document.body.appendChild(a);a.focus();a.select();try{document.execCommand('copy')}finally{document.body.removeChild(a)}}
function openWALink(){const t=encodeURIComponent(document.getElementById('waEd')?.value||'');window.open(`https://wa.me/?text=${t}`)}

// ═══════════════ SESSION PERSISTENCE ═══════════════
const SESS_KEY = 'pv5_session';
const REM_KEY  = 'pv5_remembered';

// Timeouts per role
const SESS_TIMEOUT = {
  security:  null,           // never expires
  admin:     30*60*1000,     // 30 minutes inactivity
  moderator: 30*60*1000,     // 30 minutes inactivity
  resident:  null,           // PIN every time, but flat remembered 7 days
};
const REM_DAYS = 7 * 24 * 60 * 60 * 1000; // 7 days for resident flat memory

// ── Save session on login ──
function saveSession(role, pid){
  const sess = {role, pid, loginAt: Date.now(), lastAct: Date.now()};
  sls(SESS_KEY, sess);
  // For residents: also remember their flat for 7 days
  if(role === 'resident'){
    const p = P.find(x=>x.id===pid);
    if(p) sls(REM_KEY, {pid:p.id, flatNo:p.flatNo, name:p.name, savedAt:Date.now()});
  }
}

// ── Update lastAct on every interaction ──
function touchSession(){
  const sess = gls(SESS_KEY, null);
  if(sess){ sess.lastAct = Date.now(); sls(SESS_KEY, sess); }
}
document.addEventListener('touchstart', touchSession, {passive:true});
document.addEventListener('click', touchSession);

// ── Clear session on sign out ──
function clearSession(){
  localStorage.removeItem(SESS_KEY);
  // Do NOT clear REM_KEY on sign out — resident flat stays remembered
}

// ── Boot: decide what to show ──
function bootApp(){
  // Clear any stale open roll call sessions from previous boots
  let rcChanged=false;
  RC.forEach(s=>{
    if(!s.closed){
      // If session is older than 12 hours and not closed — auto-close it
      if(Date.now()-s.t>12*3600000){s.closed=true;s.closedAt=s.t+1000;rcChanged=true;}
    }
  });
  if(rcChanged)sls('pv5_rc',RC);

  const sess = gls(SESS_KEY, null);
  const rem  = gls(REM_KEY,  null);

  // 1. Active session?
  if(sess && sess.role && sess.pid){
    const timeout = SESS_TIMEOUT[sess.role];
    const age = Date.now() - sess.lastAct;

    if(timeout === null){
      // Security: never expires — auto-login
      if(sess.role === 'security'){
        const p = P.find(x=>x.id===sess.pid);
        if(p){ autoLogin(sess.role, p); return; }
      }
      // Resident: session key set but we always ask PIN — fall through to remembered
    } else {
      // Admin / Moderator: check inactivity
      if(age < timeout){
        const p = P.find(x=>x.id===sess.pid);
        if(p){ autoLogin(sess.role, p); return; }
      } else {
        // Timed out — clear session, show PIN for their role
        const role = sess.role;
        const pid  = sess.pid;
        localStorage.removeItem(SESS_KEY);
        const p = P.find(x=>x.id===pid);
        if(p){
          showToastOnLanding(`Session expired — please re-enter your PIN`);
          showLandingPIN(pid, p.name.split(' ')[0], role);
          return;
        }
      }
    }
  }

  // 2. Remembered resident flat?
  if(rem && rem.pid && rem.savedAt){
    const age = Date.now() - rem.savedAt;
    if(age < REM_DAYS){
      const p = P.find(x=>x.id===rem.pid);
      if(p){
        // Skip welcome + role select + flat select → go straight to PIN
        showLandingPIN(rem.pid, p.name.split(' ')[0], 'resident', true);
        return;
      }
    } else {
      // Remembered flat expired after 7 days
      localStorage.removeItem(REM_KEY);
    }
  }

  // 3. Fresh start
  showLanding();
}

// ── Auto-login without PIN (session still valid) ──
function autoLogin(role, p){
  document.getElementById('nBtn').style.display='flex';
  document.getElementById('rBtn').style.display='flex';
  history.pushState(null,'',location.href);
  setRole(role, p);
  // Refresh from Sheets on auto-login
  if(typeof SCRIPT_URL!=='undefined'&&SCRIPT_URL)loadFromSheets().then(ok=>{if(ok)render()});
}

// ── Show a small toast before the landing page loads ──
function showToastOnLanding(msg){
  const t=document.createElement('div');
  t.style.cssText='position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#fff;border:2px solid var(--amb);border-radius:99px;padding:10px 20px;font-size:13px;font-weight:700;color:var(--amb);z-index:601;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.1)';
  t.textContent=msg;document.body.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.remove(),300)},3000);
}

// ── Inactivity checker for Admin/Mod ──
// Runs every 60s; if inactive > 30min, returns to PIN screen
setInterval(()=>{
  if(!cRole) return;
  const timeout = SESS_TIMEOUT[cRole];
  if(!timeout) return; // security and resident: no inactivity check
  const sess = gls(SESS_KEY, null);
  if(!sess) return;
  const age = Date.now() - sess.lastAct;
  if(age >= timeout){
    const pid = sess.pid; const role = sess.role;
    localStorage.removeItem(SESS_KEY);
    const p = P.find(x=>x.id===pid);
    cRole=null; cP=null;
    document.getElementById('nBtn').style.display='none';
    document.getElementById('rBtn').style.display='none';
    document.getElementById('nav').innerHTML='';
    showToastOnLanding('Session expired — please re-enter your PIN');
    if(p) showLandingPIN(pid, p.name.split(' ')[0], role);
    else showLanding();
  }
}, 60000);

// Check roll call warning every minute
setInterval(()=>{
  if(cRole==='security'){
    const now=new Date();const h=now.getHours();
    if(h>=23){
      const done=RC.find(s=>s.closed&&isSameDay(s.t,Date.now()));
      if(!done){
        const bar=document.getElementById('rcWarn');
        if(bar){bar.classList.add('show');document.getElementById('rcWarnTxt').textContent='⚠ 11 PM — Roll call not completed today!';}
      }
    }
  }
},60000);
